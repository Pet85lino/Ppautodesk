# CI de LINO Audio Diagnostic: lint (ruff) + tests (pytest) en cada push/PR.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Librerias de sistema que requiere Qt en modo offscreen.
      - name: Instalar dependencias de sistema (Qt offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest + coverage)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov --cov-report=term-missing
